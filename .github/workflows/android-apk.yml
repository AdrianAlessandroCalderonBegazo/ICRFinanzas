name: APK Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to a release when a v* tag is pushed

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck y pruebas
        run: |
          npm run typecheck
          npm test

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: app/android
        # Phone ABIs plus x86_64 for the emulator test; the release build is signed with the debug key.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Renombrar APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "ICR-Finanzas-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ICR-Finanzas-apk-${{ github.run_number }}
          path: app/ICR-Finanzas-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/ICR-Finanzas-${{ github.run_number }}.apk

  smoke-test:
    name: Probar que abre (Android ${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "8", api: 26, target: google_apis }
          - { name: "11", api: 30, target: google_apis }
          - { name: "15 (16 KB)", api: 35, target: google_apis_ps16k }
          - { name: "16", api: 36, target: google_apis }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ICR-Finanzas-apk-${{ github.run_number }}

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-test.sh ICR-Finanzas-${{ github.run_number }}.apk
