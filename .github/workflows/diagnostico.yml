name: Diagnóstico de arranque

# Construye la versión actual, la abre en emuladores Android y reporta cualquier crash.
# No forma parte del build normal: solo corre a mano (Actions → Diagnóstico de arranque → Run workflow).
on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # "arm" is what the normal APK workflow builds; "all" adds the PC/emulator architectures.
          - { name: arm, archs: "armeabi-v7a,arm64-v8a" }
          - { name: all, archs: "armeabi-v7a,arm64-v8a,x86,x86_64" }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: diag-apk-${{ matrix.name }}
          path: app/android/app/build/outputs/apk/release/app-release.apk

  abrir:
    name: Android ${{ matrix.os }} · APK ${{ matrix.apk }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "11", api: 30, apk: arm }
          - { os: "11", api: 30, apk: all }
          - { os: "15", api: 35, apk: arm }
          - { os: "15", api: 35, apk: all }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diag-apk-${{ matrix.apk }}
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/diagnostico/tour.py app-release.apk "Android ${{ matrix.os }} · APK ${{ matrix.apk }}"
