server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html (y el resto de archivos sin hash en el nombre) nunca se
    # cachean: cada despliegue nuevo debe verse sin que el usuario tenga que
    # forzar una recarga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # El JS/CSS bajo _expo/static/ sí lleva un hash de contenido en el
    # nombre de archivo (Metro los versiona) — cachearlos agresivo no corre
    # riesgo de servir una versión vieja, y ayuda justo al tipo de conexión
    # limitada que tiene el personal de campo (menos para re-descargar en
    # cada visita).
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Los archivos de Tesseract.js (OCR en web) no llevan hash en el nombre
    # y sí pueden cambiar si se actualiza la versión (ver public/tesseract/
    # README.md) — cache corta en vez de ninguna o permanente.
    location /tesseract/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
